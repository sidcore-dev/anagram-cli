[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anagram-cli"
version = "1.0.0"
description = "Check whether two words/phrases are anagrams, or find anagrams of a word in a wordlist file, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["anagram", "cli", "wordplay", "text"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing",
]

[project.scripts]
anagram-cli = "anagram_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
